<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#222;--mu:#6b6b6b;--ac:#d9433b;--ln:#e6e2d8;--chip:#f0ece2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#eee;--mu:#a0a0a6;--ac:#ff7a70;--ln:#34343a;--chip:#2d2d33}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#eee;--mu:#a0a0a6;--ac:#ff7a70;--ln:#34343a;--chip:#2d2d33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{padding:20px 16px 8px}
h1{margin:0;font-size:22px}
.sub{color:var(--mu);font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--ln)}
nav button{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
h2{font-size:19px;margin:8px 0 2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:2px 0;font-size:14px}
.tr{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 8px;font-size:12px;margin-right:4px}
a.map{display:inline-block;margin-top:6px;color:var(--ac);font-size:14px;text-decoration:none;border:1px solid var(--ac);border-radius:8px;padding:2px 10px}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:8px;font-size:15px}
.seg button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.warn{border-left:4px solid var(--ac)}
.fin{text-align:center;color:var(--mu);margin:20px 0}
ul{margin:4px 0 4px 18px;padding:0;font-size:14px}
.ov{max-width:640px;margin:0 auto;padding:0 16px}
</style>
</head>

var nav=document.getElementById('nav'),main=document.getElementById('main'),cur=0,plan='A';
function card(i){
if(i.fin)return '<div class="fin">'+i.t+'</div>';
var h='<div class="card'+(i.w&&i.w!==1?' warn':'')+'"><h3>'+(i.p?'<span class="tag">Plan '+i.p+'</span>':'')+i.t+'</h3>';
if(i.n)h+='<p>'+i.n+'</p>';
if(i.tr)h+='<p class="tr">⏱ '+i.tr+'</p>';
if(i.w&&i.w!==1)h+='<p><b>'+i.w+'</b></p>';
if(i.l)h+='<a class="map" href="'+i.l+'" target="_blank" rel="noopener">Naver 地圖 ↗</a>';
return h+'</div>';}
function render(){
var d=D[cur],h='<h2>'+d.k+'・'+d.dt+'</h2><div class="sub">'+d.ti+'</div>';
var hasP=d.it.some(function(x){return x.p});
if(hasP)h+='<div class="seg"><button data-p="A" class="'+(plan=='A'?'on':'')+'">Plan A</button><button data-p="B" class="'+(plan=='B'?'on':'')+'">Plan B</button></div>';
var shown=false;
d.it.forEach(function(x){
if(x.p&&x.p!==plan)return;
h+=card(x);});
main.innerHTML=h;
main.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){plan=b.dataset.p;render();}});
nav.querySelectorAll('button').forEach(function(b,i){b.className=i==cur?'on':'';});
window.scrollTo(0,0);}
D.forEach(function(d,i){var b=document.createElement('button');b.textContent=d.k+' '+d.dt.split('（')[0];b.onclick=function(){cur=i;render();};nav.appendChild(b);});
render();
</script>
